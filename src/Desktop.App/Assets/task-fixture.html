<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>任务点离线验收</title>
<style>body{font:16px sans-serif}video{width:200px;height:100px}li{cursor:pointer}</style>
<input id="courseId" value="task-course" type="hidden">
<ul id="coursetree">
 <li class="currents" onclick="window.chapterClicks=(window.chapterClicks||0)+1">第一章<span class="roundpoint"></span></li>
 <li onclick="window.chapterClicks=(window.chapterClicks||0)+1">第二章<span class="roundpoint"></span></li>
</ul>
<ul class="prev_ul">
 <li class="active" onclick="window.tabClicks=(window.tabClicks||0)+1">1 视频</li>
 <li onclick="window.tabClicks=(window.tabClicks||0)+1">2 章节测验</li>
</ul>
<video id="media" muted controls></video>
<script>
// 生成一秒静音 WAV，用真实 HTMLMediaElement 核验阈值推进与暂停。
const data = new Uint8Array(16044), header = new DataView(data.buffer);
const write = (offset, value) => [...value].forEach((c, i) => data[offset + i] = c.charCodeAt(0));
write(0,'RIFF');header.setUint32(4,16036,true);write(8,'WAVE');write(12,'fmt ');
header.setUint32(16,16,true);header.setUint16(20,1,true);header.setUint16(22,1,true);
header.setUint32(24,8000,true);header.setUint32(28,16000,true);header.setUint16(32,2,true);header.setUint16(34,16,true);
write(36,'data');header.setUint32(40,16000,true);
document.querySelector('video').src=URL.createObjectURL(new Blob([data],{type:'audio/wav'}));
</script></html>
