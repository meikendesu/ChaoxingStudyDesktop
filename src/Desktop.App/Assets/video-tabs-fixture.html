<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>视频标签离线验收</title>
<style>body{font:16px sans-serif}video{width:200px;height:100px}li{cursor:pointer}</style>
<ul class="prev_ul">
 <li class="active" onclick="selectVideo(0)">1 视频</li>
 <li onclick="selectVideo(1)">2 视频</li>
 <li onclick="window.tabClicks=(window.tabClicks||0)+1;document.querySelectorAll('.prev_ul li').forEach(x=>x.classList.remove('active'));this.classList.add('active')">3 章节测验</li>
</ul>
<video id="media" muted controls></video>
<script>
const data = new Uint8Array(16044), header = new DataView(data.buffer);
const write = (offset, value) => [...value].forEach((c, i) => data[offset + i] = c.charCodeAt(0));
write(0,'RIFF');header.setUint32(4,16036,true);write(8,'WAVE');write(12,'fmt ');
header.setUint32(16,16,true);header.setUint16(20,1,true);header.setUint16(22,1,true);
header.setUint32(24,8000,true);header.setUint32(28,16000,true);header.setUint16(32,2,true);header.setUint16(34,16,true);
write(36,'data');header.setUint32(40,16000,true);
const sources = [0,1].map(()=>URL.createObjectURL(new Blob([data],{type:'audio/wav'})));
window.videoOrder = [];
function selectVideo(index) {
 window.tabClicks=(window.tabClicks||0)+1;
 window.videoOrder.push(index);
 document.querySelectorAll('.prev_ul li').forEach((el,i)=>el.classList.toggle('active', i===index));
 document.querySelector('#media').src=sources[index];
}
document.querySelector('video').src=sources[0];
</script>
