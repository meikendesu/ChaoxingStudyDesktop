<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>学习流程离线验收</title>
<style>body{font:16px sans-serif}video{width:200px;height:100px}label{display:block}iframe{width:95%;height:180px}</style>
<input id="courseId" value="fixture-course" type="hidden">
<ul id="coursetree">
 <li class="currents" onclick="window.chapterClicks=(window.chapterClicks||0)+1">第一章<span class="roundpoint"></span></li>
 <li onclick="window.chapterClicks=(window.chapterClicks||0)+1">第二章<span class="roundpoint"></span></li>
</ul>
<video id="media" muted controls></video>
<section class="questionLi"><h3>1 + 1 = ?</h3><label><input type="radio" name="q1">1</label><label><input type="radio" name="q1">2</label></section>
<section class="questionLi"><h3>选择偶数</h3><label><input type="checkbox">2</label><label><input type="checkbox">3</label><label><input type="checkbox">4</label></section>
<section class="questionLi"><h3>两个填空</h3><input type="text"><input type="text"></section>
<section class="questionLi"><h3>单选题：自定义选项</h3><div role="radio" aria-checked="false" onclick="this.setAttribute('aria-checked','true');this.nextElementSibling.setAttribute('aria-checked','false')">甲</div><div role="radio" aria-checked="false" onclick="this.setAttribute('aria-checked','true');this.previousElementSibling.setAttribute('aria-checked','false')">乙</div></section>
<div style="display:none"><section class="questionLi">隐藏题目</section><video></video></div>
<button onclick="window.submitClicks=(window.submitClicks||0)+1">提交</button>
<iframe src="https://fixture.chaoxing.com/study-frame.html"></iframe>
<script>
// 生成一秒静音 WAV，用真实 HTMLMediaElement 核验 play / pause / ended。
const data = new Uint8Array(16044), header = new DataView(data.buffer);
const write = (offset, value) => [...value].forEach((c, i) => data[offset + i] = c.charCodeAt(0));
write(0,'RIFF');header.setUint32(4,16036,true);write(8,'WAVE');write(12,'fmt ');
header.setUint32(16,16,true);header.setUint16(20,1,true);header.setUint16(22,1,true);
header.setUint32(24,8000,true);header.setUint32(28,16000,true);header.setUint16(32,2,true);header.setUint16(34,16,true);
write(36,'data');header.setUint32(40,16000,true);
document.querySelector('video').src=URL.createObjectURL(new Blob([data],{type:'audio/wav'}));
</script></html>
